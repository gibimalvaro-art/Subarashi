name: diagnostico-qt
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-2022
    steps:
      - shell: bash
        run: |
          B=https://download.qt.io/online/qtsdkrepository/windows_x86/desktop
          curl -sL $B/ | grep -o 'href="[^"]*"' | grep -i qt6_61 | head -40
          echo ---- qt6_6121
          curl -sL $B/qt6_6121/ | grep -o 'href="[^"]*"' | head -40
          for d in $(curl -sL $B/qt6_6121/ | grep -o 'href="qt6_6121[^"/]*' | cut -d'"' -f2 | head -6); do echo "---- $d"; curl -sL $B/qt6_6121/$d/ | grep -o 'href="[^"]*"' | head -15; done
          pip install -q aqtinstall==3.3.0
          python -m aqt list-qt windows desktop --arch 6.12.1 || true
          python -m aqt list-qt windows desktop --modules 6.12.1 win64_msvc2022_64 || true
          python -m aqt list-qt windows desktop | tail -3
