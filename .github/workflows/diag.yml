name: diagnostico-qt
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-2022
    steps:
      - shell: bash
        run: |
          set +e +o pipefail
          B=https://download.qt.io/online/qtsdkrepository/all_os/extensions/qtwebengine/6120/61400
          ls_() { curl -sL "$1/" | grep -o 'href="[^"?][^"]*"' | grep -v -E 'static|mirrorbrain|apache' ; }
          echo "== 61400"; ls_ $B | head -40
          for d in $(ls_ $B | cut -d'"' -f2 | grep '/$' | head -6); do echo "== $d"; ls_ $B/$d | head -12; done
