name: diagnostico-qt
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-2022
    steps:
      - shell: bash
        run: |
          set +e +o pipefail
          B=https://download.qt.io/online/qtsdkrepository
          ls_() { curl -sL "$1/" | grep -o 'href="[^"?/][^"]*"' | grep -v -E 'static|mirrorbrain|apache' ; }
          echo "== windows_x86/addons"; ls_ $B/windows_x86/addons | head -40
          echo "== all_os/extensions"; ls_ $B/all_os/extensions | head -20
          for p in $B/windows_x86/addons/qtwebengine $B/all_os/extensions/qtwebengine; do echo "== $p"; ls_ $p | head -15; done
          for v in 6121 612; do for p in $B/windows_x86/addons/qtwebengine/$v $B/windows_x86/addons/qt6_$v; do echo "== $p"; ls_ $p | head -20; done; done
