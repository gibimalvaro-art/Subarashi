name: diagnostico-qt
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          python .github/scripts/install_qt.py 6.12.1 D:\Qt qt5compat qtmultimedia qtpositioning qthttpserver qtwebsockets qtwebengine qtwebchannel qtimageformats qtnetworkauth qtshadertools
          Get-ChildItem D:\Qt -Depth 1
          $root = (Get-Content $env:GITHUB_ENV | Select-String "QT_ROOT_DIR=" | Select-Object -Last 1).ToString() -replace "QT_ROOT_DIR=",""
          & "$root\bin\qtpaths.exe" --qt-query | Select-Object -First 8
          Get-ChildItem "$root\lib\cmake" -Name | Select-String "WebEngine|Multimedia|HttpServer|Core5Compat|Positioning|WebSockets|Svg|Quick$"
