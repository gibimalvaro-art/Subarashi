name: diagnostico-qt
on: workflow_dispatch
jobs:
  d:
    runs-on: windows-2022
    steps:
      - shell: bash
        run: |
          B=https://download.qt.io/online/qtsdkrepository/windows_x86
          ls_() { curl -sL "$1/" | grep -o 'href="[^"?/][^"]*"' | grep -v -E 'static|mirrorbrain|apache' ; }
          echo "== extensions"; ls_ $B/extensions
          echo "== extensions/qtwebengine"; ls_ $B/extensions/qtwebengine | tail -12
          for v in 6121 612 6120; do echo "== qtwebengine/$v"; ls_ $B/extensions/qtwebengine/$v; done
          echo "== desktop/qt6_612"; ls_ $B/desktop/qt6_612 | head -30
