# Subarashi: compila o app para Mac (Apple Silicon: M1, M2, M3, M4...) nos
# computadores do GitHub.
#
# Como usar: aba "Actions" > "Compilar Subarashi para macOS" > "Run workflow".
# A primeira vez é longa (as bibliotecas do núcleo do Jami são compiladas do
# zero). Elas ficam guardadas em cache para as próximas vezes.
#
# Resultado: um .dmg com o Subarashi.app, publicado na aba "Releases".
# O app não é assinado pela Apple (exigiria conta paga de desenvolvedor), então
# o macOS pede uma liberação manual na primeira abertura (veja o LEIA-ME).

name: Compilar Subarashi para macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 355
    env:
      TARBALLS: ${{ github.workspace }}/tarballs
      CONFIGURE_FLAGS: --without-dbus
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Baixar o código (com o núcleo do Jami)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restaurar bibliotecas já compiladas
        uses: actions/cache/restore@v4
        with:
          path: |
            tarballs
            daemon/contrib/*-apple-darwin*
            daemon/contrib/build-*-apple-darwin*
          key: contrib-macos-${{ hashFiles('daemon/contrib/src/**') }}-${{ github.run_id }}
          restore-keys: |
            contrib-macos-${{ hashFiles('daemon/contrib/src/**') }}-
            contrib-macos-

      - name: Instalar ferramentas e o Qt 6.12 (Homebrew)
        run: |
          brew install autoconf automake libtool pkg-config yasm nasm ninja gettext qt
          brew --prefix qt
          ls "$(brew --prefix qt)/bin" | grep -E "macdeployqt|qmake" || true
          cmake --version
          if ! command -v cargo >/dev/null; then brew install rust; fi
          cargo --version

      - name: Ajustes no núcleo para o Mac
        run: |
          # O minizip baixa o zstd na configuração, e o zstd atual conflita com o
          # CMake 4.x dos Macs do GitHub (export set duplicado). O Jami não lê
          # zips com zstd, então o codec é desligado, como o próprio Jami já faz
          # com o bzip2.
          f=daemon/contrib/src/minizip/rules.mak
          grep -q "MZ_ZSTD" "$f" || perl -0pi -e 's/(-DMZ_BZIP2=OFF \\\n)/$1\t\t-DMZ_ZSTD=OFF \\\n/' "$f"
          grep -n "MZ_" "$f"

      - name: Configurar (compila as bibliotecas do núcleo na primeira vez)
        timeout-minutes: 300
        run: |
          mkdir -p "$TARBALLS"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_DAEMON_SUBMODULE=ON \
            -DENABLE_CRASHREPORTS=OFF \
            -DBUILD_TESTING=OFF \
            -DPROJ_NAME=Jami \
            -DBUNDLE_ID=io.github.gibimalvaro-art.subarashi \
            -DPROJ_COPYRIGHT="GPLv3. Baseado no Jami, Savoir-faire Linux." \
            -DJAMI_VERSION=1.0 -DJAMI_BUILD=${{ github.run_number }}

      - name: Guardar bibliotecas compiladas (mesmo se falhar)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tarballs
            daemon/contrib/*-apple-darwin*
            daemon/contrib/build-*-apple-darwin*
          key: contrib-macos-${{ hashFiles('daemon/contrib/src/**') }}-${{ github.run_id }}

      - name: Compilar
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Montar o Subarashi.app
        run: |
          APP=$(find build -maxdepth 2 -name "*.app" -type d | head -1)
          [ -n "$APP" ] || { echo "Nenhum .app gerado"; exit 1; }
          echo "App gerado: $APP"
          rm -rf dist && mkdir dist
          cp -R "$APP" dist/Subarashi.app
          "$(brew --prefix qt)/bin/macdeployqt" dist/Subarashi.app -qmldir=src/app -verbose=1
          # Assinatura "ad hoc" (sem conta Apple), exigida para rodar em Apple Silicon.
          codesign --force --deep --sign - dist/Subarashi.app
          codesign --verify --deep --verbose=2 dist/Subarashi.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" dist/Subarashi.app/Contents/Info.plist
          du -sh dist/Subarashi.app

      - name: Gerar o .dmg
        run: |
          mkdir -p dmg && cp -R dist/Subarashi.app dmg/ && ln -s /Applications dmg/Applications
          cp LEIA-ME-SUBARASHI.md dmg/ && cp COPYING dmg/LICENCA-GPLv3.txt
          hdiutil create -volname Subarashi -srcfolder dmg -ov -format UDZO Subarashi-macos-arm64.dmg
          ls -la Subarashi-macos-arm64.dmg

      - name: Guardar o .dmg nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: Subarashi-macos-arm64
          path: Subarashi-macos-arm64.dmg

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-${{ github.run_number }}
          name: Subarashi para Mac (compilação ${{ github.run_number }})
          body: |
            Para Macs com chip Apple (M1, M2, M3, M4...), macOS 14.4 ou mais novo.
            Abra o `Subarashi-macos-arm64.dmg` e arraste o Subarashi para Aplicativos.
            Na primeira abertura o macOS bloqueia (o app não é assinado pela Apple):
            Ajustes do Sistema > Privacidade e Segurança > "Abrir Mesmo Assim".
            Não instale junto com o Jami oficial no mesmo Mac.
          files: Subarashi-macos-arm64.dmg
